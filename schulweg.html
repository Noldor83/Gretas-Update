(()=>{

const sfx=(()=>{

})();
const NOTE={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};

const SONGS={
 dorf:{bpm:140,lead:'pulse',vol:0.045,arp:true,lead_:['C5 - E5 - G5 - E5 - C5 - D5 - E5 - - -','F5 - E5 - D5 - C5 - D5 - - - G4 - - -','C5 - E5 - G5 - A5 - G5 - E5 - C5 - - -','D5 - F5 - E5 - D5 - C5 - - - . . . .','A5 - G5 - F5 - E5 - F5 - - - D5 - - -','G5 - F5 - E5 - D5 - E5 - - - C5 - - -','F5 - A5 - G5 - F5 - E5 - G5 - C6 - - -','B5 - G5 - D5 - B4 - C5 - - - . . . .'],bass:[48,53,48,43,53,48,53,43],drums:'k.h.s.h.k.k.s.h.'},

 rad:{bpm:160,lead:'pulse',vol:0.042,arp:true,lead_:['G4 - B4 - D5 - G5 - F#5 - D5 - E5 - D5 -','C5 - E5 - G5 - E5 - D5 - - - B4 - - -','G4 - B4 - D5 - G5 - A5 - G5 - F#5 - E5 -','D5 - - - A4 - B4 - G4 - - - . . . .','E5 - E5 - D5 - C5 - B4 - C5 - D5 - - -','C5 - C5 - B4 - A4 - G4 - A4 - B4 - - -','E5 - G5 - F#5 - E5 - D5 - B4 - A4 - B4 -','G4 - - - D5 . D5 . G5 - - - . . . .'],bass:[43,48,43,50,45,48,45,43],drums:'k.h.k.s.k.h.k.s.'},
 stadt:{bpm:132,lead:'pulse',vol:0.042,arp:true,lead_:['D5 - F#5 - A5 - - - F#5 - G5 - A5 - B5 -','A5 - - - F#5 - D5 - E5 - - - . . . .','B4 - D5 - G5 - - - F#5 - E5 - D5 - E5 -','F#5 - - - E5 - D5 - A4 - - - . . . .','G5 - G5 - F#5 - E5 - F#5 - - - D5 - - -','E5 - E5 - D5 - C#5 - D5 - - - . . . .','B5 - A5 - G5 - F#5 - G5 - A5 - B5 - C#6 -','D6 - - - A5 - F#5 - D5 - - - . . . .'],bass:[50,45,43,45,43,45,43,50],drums:'k.h.s.hhk.h.s.h.'},
 joost:{bpm:118,lead:'pulse',vol:0.04,arp:true,lead_:['D5 - - - C#5 - D5 - F5 - - - E5 - Eb5 -','D5 - - - . . A4 - G#4 - - - A4 - - -','D5 - - - F5 - G#5 - A5 - - - G#5 - F5 -','E5 - F5 - E5 - Eb5 - D5 - - - . . . .','A5 - - - G#5 - A5 - Bb5 - - - A5 - F5 -','G#5 - - - E5 - D5 - C#5 - - - . . . .','D5 - F5 - G#5 - B5 - D6 - - - C#6 - - -','D5 - - - . . . . A4 - - - D4 - - -'],bass:[38,38,44,37,38,44,41,38],drums:'k...h.s.k.k.h.s.'},
 schule:{bpm:138,lead:'pulse',vol:0.042,arp:true,lead_:['F5 - A5 - C6 - A5 - G5 - F5 - G5 - - -','A5 - G5 - F5 - D5 - C5 - - - . . . .','Bb4 - D5 - F5 - Bb5 - A5 - G5 - F5 - G5 -','A5 - - - C5 . C5 . F5 - - - . . . .','D5 - F5 - A5 - - - G5 - E5 - C5 - - -','Bb4 - D5 - G5 - - - F5 - E5 - F5 - - -','A5 - C6 - Bb5 - A5 - G5 - A5 - Bb5 - G5 -','F5 - - - C5 - A4 - F4 - - - . . . .'],bass:[41,41,46,41,38,43,48,41],drums:'k.h.s.h.k.hks.h.'},
 lehrer:{bpm:126,lead:'pulse',vol:0.042,arp:true,lead_:['E5 - - - B4 - E5 - G5 - F#5 - E5 - D#5 -','E5 - - - . . B4 - C5 - - - B4 - - -','G5 - F#5 - E5 - D#5 - E5 - B4 - G4 - B4 -','C5 - - - B4 - A4 - B4 - - - . . . .','E5 - G5 - B5 - - - A#5 - B5 - G5 - E5 -','F5 - - - E5 - D#5 - E5 - - - . . . .'],bass:[40,40,43,45,40,41],drums:'k..hs..hk.k.s.hh'},

 wecker:{bpm:150,lead:'pulse',vol:0.04,lead_:['G5 - E5 - C5 - E5 - G5 - - - C6 - - -','B5 - G5 - D5 - G5 - C6 - - - . . . .'],bass:[48,43],drums:'k...s...k...s...'}
};
const chip=(()=>{ let timer=null, cur=null, step=0, nextT=0, pw=null, bus=null, nb=null;
  const mtof=m=>440*Math.pow(2,(m-69)/12);
  function setup(ac){ if(pw) return; const n=24, re=new Float32Array(n), im=new Float32Array(n), d=0.3; for(let k=1;k<n;k++){ re[k]=(2/(k*Math.PI))*Math.sin(2*Math.PI*k*d); im[k]=(2/(k*Math.PI))*(1-Math.cos(2*Math.PI*k*d)); } pw=ac.createPeriodicWave(re,im); const len=Math.floor(ac.sampleRate*0.3); nb=ac.createBuffer(1,len,ac.sampleRate); const dd=nb.getChannelData(0); for(let i=0;i<len;i++) dd[i]=Math.random()*2-1;
    const lp=ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3200; const out=ac.createGain(); out.gain.value=0.5; bus=ac.createGain(); bus.gain.value=1; bus.connect(lp); lp.connect(out); out.connect(sfx.out()); }
  function osc(ac,type,f,t,d,v){ const o=ac.createOscillator(), g=ac.createGain(); if(type==='pulse') o.setPeriodicWave(pw); else o.type=type; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(v,t+0.012); g.gain.setValueAtTime(v,t+Math.max(0.012,d*0.5)); g.gain.exponentialRampToValueAtTime(0.0001,t+d); o.connect(g); g.connect(bus); o.start(t); o.stop(t+d+0.03); }
  function hit(ac,t,d,v,hp){ const s=ac.createBufferSource(); s.buffer=nb; const f=ac.createBiquadFilter(); f.type='highpass'; f.frequency.value=hp; const g=ac.createGain(); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+d); s.connect(f); f.connect(g); g.connect(bus); s.start(t); s.stop(t+d+0.02); }
  function kick(ac,t,v){ const o=ac.createOscillator(), g=ac.createGain(); o.type='sine'; o.frequency.setValueAtTime(140,t); o.frequency.exponentialRampToValueAtTime(40,t+0.12); g.gain.setValueAtTime(v,t); g.gain.exponentialRampToValueAtTime(0.0001,t+0.16); o.connect(g); g.connect(bus); o.start(t); o.stop(t+0.18); }
  function play(ac,S,st,t){ const sd=60/S.bpm/4, i=st%16, bar=Math.floor(st/16)%S.bass.length, b=S.bass[bar];
    for(const e of S.ev) if(e.s===st){ const f=mtof(e.m), d=e.len*sd*0.92; osc(ac,'pulse',f,t,d,S.vol); osc(ac,'triangle',f,t,d,S.vol*0.6); }
    if(i%2===0){ const bn=b+((i%8===4)?12:(i%8===6?7:0)); osc(ac,'triangle',mtof(bn-12),t,sd*1.6,0.13); }
    if(S.arp&&i%2===1){ const ar=[0,4,7,12][(st>>1)%4]; osc(ac,'triangle',mtof(b+24+ar),t,sd*0.8,0.012); }
    const dch=S.drums[i]; if(dch==='k') kick(ac,t,0.22); else if(dch==='s') hit(ac,t,0.1,0.06,1200); else if(dch==='h') hit(ac,t,0.025,0.02,7000); }

  const dx=(P.x+P.w/2)-(L.x+L.w/2), adx=Math.abs(dx); L.t+=dt;
  if(W.bellT>0){ W.bellT-=dt; if(W.bellT<=0){ L.st='ears'; L.t=0; L.vx=0; W.ringT=3.2; sfx.schoolbell(); shake=0.2; } }
  if(W.ringT>0) W.ringT-=dt;
  if(L.st==='ears'){ L.vx=0; if(L.t>3.0){ L.st='walk'; L.cd=1.6; } }
  else if(L.st==='stagger'){ L.vx*=0.9; if(L.t>0.5){ L.st='walk'; L.cd=Math.max(L.cd,1.2); } }
  else if(L.st==='walk'){ L.dir=dx<0?-1:1; L.vx=adx>40?L.dir*36:(adx<26?-L.dir*18:0); L.cd-=dt;
    if(adx<34&&L.cd<1.0){ L.st='wind'; L.t=0; L.vx=0; }
    else if(L.cd<=0){ const a=['chalk','sponge','papers'][L.next++%3]; L.st=a; L.t=0; L.vx=0; L.shots=0; } }
  else if(L.st==='wind'){ L.vx=0; if(L.t>0.55){ L.st='swing'; L.t=0; sfx.swing(); } }
  else if(L.st==='swing'){ const hb={x:L.dir>0?L.x+L.w:L.x-26,y:L.y+4,w:26,h:20}; if(overlap(P,hb)) hurt(L); if(L.t>0.25){ L.st='walk'; L.cd=1.9; } }
  else if(L.st==='chalk'){ if(L.t>0.45+L.shots*0.5&&L.shots<2){ L.shots++; W.shots.push({kind:'chalk',x:L.x+L.w/2+L.dir*8,y:L.y+10,vx:L.dir*165,vy:0,g:0,life:2.5}); sfx.throw(); } if(L.t>1.6){ L.st='walk'; L.cd=1.9; } }
  else if(L.st==='sponge'){ if(L.t>0.4&&!L.shots){ L.shots=1; const tt=0.8; W.shots.push({kind:'sponge',x:L.x+L.w/2,y:L.y+6,vx:dx/tt,vy:-230,g:420,life:3}); sfx.throw(); } if(L.t>1.1){ L.st='walk'; L.cd=1.8; } }
  else if(L.st==='papers'){ if(L.t>0.4&&L.shots<3&&L.t>0.4+L.shots*0.4){ L.shots++; const px=P.x+P.w/2+(Math.random()*2-1)*70; W.shots.push({kind:'paper',x:Math.max((ARENA.x0+1)*TS,Math.min(ARENA.x1*TS,px)),y:-8,vx:0,vy:55,g:0,life:4,ph:Math.random()*6}); sfx.throw(); } if(L.t>2.0){ L.st='walk'; L.cd=1.9; } }
  L.vy=Math.min(L.vy+900*dt,420); move(L,dt); if(L.x<(ARENA.x0+1)*TS) L.x=(ARENA.x0+1)*TS; if(L.x>ARENA.x1*TS-L.w) L.x=ARENA.x1*TS-L.w;
  if(overlap(P,L)){ if(stompable(L)&&L.inv<=0){ bounceP(); hitLehrer(P.x<L.x?1:-1); } else if(L.inv<=0&&P.inv<=0&&L.st!=='stagger'&&L.st!=='ears') hurt(L); }
  if(stickHits(L)&&L.inv<=0) hitLehrer(P.dir);
}
function hitLehrer(dir){ const L=W.lehrer; L.hp--; L.inv=0.6; game.hits+=2; sfx.bonk(); burst(L.x+L.w/2,L.y+8,8,['#fff','#ffd24a','#8ad0ff'],60,20); shake=0.1; L.st='stagger'; L.t=0; L.vx=dir*60; L.shots=9;
  if(L.hp===8&&!L.bell){ L.bell=true; W.bellT=0.6; }
  if(L.hp===5&&!L.bag){ L.bag=true; W.bag={x:L.x+L.w/2-7,y:UPY-8}; }

  bossBar(true); }

function drawLehrer(t){ const L=W.lehrer; if(!L) return; const feet=L.y+L.h, cx=L.x+L.w/2; if(!L.dead&&L.inv>0&&Math.floor(t*16)%2) return;

  if(!L.dead){ const hx=cx+(L.dir<0?-3:3), hy=feet-17; ctx.save(); ctx.translate(hx,hy); if(L.dir<0) ctx.scale(-1,1); ctx.rotate(w?-2.3:(sw?0.15:-0.6)); R(0,-1,20,2,'#5a3a1a'); R(0,-1,20,1,'#7a5a2a'); ctx.restore(); }
  ctx.restore(); if(L.dead) for(let k=0;k<3;k++){ const a=t*5+k*2.1; R(cx+(L.dir<0?16:-16)+Math.cos(a)*8,feet-10+Math.sin(a)*2,2,2,'#ffd24a'); } }

  ctx.fillStyle='rgba(20,24,60,.6)'; ctx.fillRect(VW-58,4,54,14); ctx.fillStyle='#fff'; ctx.font='bold 9px Trebuchet MS, sans-serif'; ctx.textBaseline='top'; ctx.fillText(game.t5+' Uhr',VW-54,7);

let last=performance.now(), acc=0; const STEP=1/120;
function frame(now){ let dt=(now-last)/1000; last=now; if(dt>0.1) dt=0.1;
  for(let i=timers2.length-1;i>=0;i--){ timers2[i].t-=dt; if(timers2[i].t<=0){ const f=timers2[i].fn; timers2.splice(i,1); f(); } }
  if(game.state==='play'){ acc+=dt; let n=0; while(acc>=STEP&&n<20){ update(STEP); acc-=STEP; n++; } updCam(dt); }
  else { acc=0; if(game.state==='faint'){ game.faintT-=dt; game.clock+=dt; if(game.faintT<=0){ respawn(); hideScreen(); game.state='play'; } } }
  document.body.classList.toggle('playing',game.state==='play'); gameEl.classList.toggle('ingame',game.state==='play'||game.state==='pause'||game.state==='faint');
  if(game.state==='intro'){ renderIntro(dt); drawBubbles(dt); }
  else if(game.state==='bus'){ renderBus(dt); drawBubbles(dt); }
  else if(game.state==='klasse'){ renderKlasse(dt); drawBubbles(dt); }
  else { render(); hud(); drawBubbles(dt); }
  requestAnimationFrame(frame); }
